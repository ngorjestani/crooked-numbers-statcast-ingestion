name: Deploy Statcast Ingestion Job

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'infra/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPOSITORY: statcast-ingest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Compute image tag
        shell: bash
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::12}" >> "${GITHUB_ENV}"

      - name: Bootstrap Azure infrastructure
        shell: bash
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam \
            location="${{ vars.AZURE_LOCATION }}" \
            acrName="${{ vars.ACR_NAME }}" \
            storageAccountName="${{ vars.STORAGE_ACCOUNT_NAME }}" \
            blobContainerName="${{ vars.STORAGE_CONTAINER_NAME }}" \
            imageName="${IMAGE_REPOSITORY}:${IMAGE_TAG}"

      - name: Build container image in Azure Container Registry
        shell: bash
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${IMAGE_REPOSITORY}:${IMAGE_TAG}" \
            .

      - name: Deploy Azure infrastructure with built image
        shell: bash
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam \
            location="${{ vars.AZURE_LOCATION }}" \
            acrName="${{ vars.ACR_NAME }}" \
            storageAccountName="${{ vars.STORAGE_ACCOUNT_NAME }}" \
            blobContainerName="${{ vars.STORAGE_CONTAINER_NAME }}" \
            imageName="${IMAGE_REPOSITORY}:${IMAGE_TAG}"
