name: Ingest Statcast Data

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Number of days to ingest, including today
        required: false
        default: "3"
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      STORAGE_MODE: azure
      BLOB_ACCOUNT_URL: https://crookednumbers.blob.core.windows.net
      STATCAST_CONTAINER: baseball-data
      STATCAST_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
      INGESTION_MODE: ${{ github.event_name == 'schedule' && 'github_actions_scheduled' || 'github_actions_manual' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Ingest Statcast data
        run: python -m crooked_numbers_ingest.ingest_statcast
